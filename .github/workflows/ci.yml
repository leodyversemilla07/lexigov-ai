name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lexigov_test

jobs:
  quality:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexigov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lexigov/api exec prisma generate

      - name: Run database migrations
        run: pnpm --filter @lexigov/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Lint
        run: pnpm lint

      - name: Test (unit)
        run: pnpm test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Test (e2e)
        run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
