packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/node-cpu-profiler': true
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - "@tailwindcss/oxide"
  - "core-js"
  - "esbuild"
  - "msw"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
